<!DOCTYPE html>
<html>
<head>
    <title>Course Evaluation Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Course Evaluation Form</h2>

<form id="courseForm" onsubmit="return validateForm()">

<div class="form-group">
<label>Student Name</label>
<input type="text" id="name" placeholder="Enter your name">
</div>

<div class="form-group">
<label>Email</label>
<input type="text" id="email" placeholder="Enter your email">
</div>

<div class="form-group">
<label>Course Name</label>
<input type="text" id="course" placeholder="Enter course name">
</div>

<div class="form-group">
<label>Instructor</label>
<input type="text" id="instructor" placeholder="Instructor name">
</div>

<div class="form-group">
<label>Course Rating</label>
<select id="rating">
<option value="">Select Rating</option>
<option>Excellent</option>
<option>Good</option>
<option>Average</option>
<option>Poor</option>
</select>
</div>

<div class="form-group">
<label>Would you recommend this course?</label>
<input type="radio" name="recommend" value="Yes"> Yes
<input type="radio" name="recommend" value="No"> No
</div>

<div class="form-group">
<label>Comments</label>
<textarea id="comments" placeholder="Write your comments"></textarea>
</div>

<div class="buttons">
<button type="submit">Submit</button>
<button type="reset">Reset</button>
</div>

</form>

<p id="error"></p>

</div>

<script src="script.js"></script>

</body>
</html>
